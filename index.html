  <style>

    .link-btn { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.05); padding: 12px 20px; border-radius: 12px; color: white; text-decoration: none; font-size: 14px; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
    .link-btn:hover { background: #38bdf8; color: #000; }
    .primary { background: #25D366 !important; border: none !important; }
  </style>
</head>
